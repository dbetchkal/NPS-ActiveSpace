[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NPS-ActiveSpace"
version = "3.0"
description = "NPS software tooling for acoustic modeling of active spaces"
requires-python = ">=3.12"  # Windows GDAL wheel is cp312-only; bumping Python requires updating that wheel and pyproj/rasterio/fiona below.
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE.md"]
authors = [
    {name="Kirby Heck"},
    {name="Adina Zucker"},
    {name="Davyd Betchkal"},
    {name="Elliott Ruebush"},
    {name="Arpit Jain"},
]
maintainers = [
    {name="Davyd Betchkal", email="davyd_betchkal@nps.gov"}
]

dependencies = [
    "geopandas>=1.1.1",
    "geopy>=2.4.1",
    "iyore @ git+https://github.com/nationalparkservice/iyore.git@b3b1e3fd025a392bf63bf6c4a8a4eebb887291ec",
    # Pinned: scipy>=1.17 hangs importing scipy.signal under Docker linux/amd64 on Apple
    # Silicon (QEMU/Rosetta), which blocks KDEpy FFTKDE in normalize_point_density().
    "KDEpy==1.1.12",
    "matplotlib>=3.10.3",
    "numpy==2.3.1",
    "pandas>=2.2,<3",
    "pillow>=11.3.0",
    "pyvista>=0.48",
    "scipy==1.16.0",
    "shapely>=2.1.1",
    "SQLAlchemy>=2.0.41",
    "timezonefinder>=8.2.4",
    "tqdm>=4.67.1",
    "psycopg2>=2.9.10 ; sys_platform == 'win32'",
    "psycopg2-binary>=2.9.10 ; sys_platform != 'win32'",
    # Geospatial stack (cgohlke/geospatial-wheels on Windows). Bump pyproj, rasterio,
    # fiona, and GDAL together.
    "pyproj==3.7.1",
    "rasterio==1.4.3",
    "fiona==1.10.1",
    "GDAL @ https://github.com/cgohlke/geospatial-wheels/releases/download/v2025.7.4/gdal-3.11.1-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
]

[project.optional-dependencies]
aam = [
    "aam-translator @ git+https://github.com/elliott-ruebush/aam-translator.git@v0.2.1",
    "netCDF4>=1.7.0",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
repository = "https://github.com/dbetchkal/NPS-ActiveSpace"

[tool.setuptools.packages.find]
where = ["."]
include = ["nps_active_space*"]
exclude = ["legacy_code*", "tests*", "example_data*"]

[tool.setuptools.package-data]
nps_active_space = [
    "config/template.config",
    "config/*_example.config",
    "propagation_model/nmsim/data/**/*",
    "img/*",
]
