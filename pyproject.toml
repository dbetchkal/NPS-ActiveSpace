[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NPS-ActiveSpace"
version = "2.0"
description = "An NPS Sound Active Space Project."
requires-python = ">=3.7"
authors = [
    {name="Kirby Heck"},
    {name="Adina Zucker"},
    {name="Davyd Betchkal"}
]
maintainers = [
    {name="Davyd Betchkal", email="davyd_betchkal@nps.gov"}
]

[project.urls]
repository = "https://github.com/dbetchkal/NPS-ActiveSpace"

[tool.setuptools]
py-modules = ['nps_active_space', '_DENA']
